<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hantoor - Coming Soon</title>
    <link rel="icon" type="image/x-icon" href="images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&family=Poppins:wght@400;500;700&family=Almarai:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="page">

        <!-- Left: hero image (desktop only) -->
        <div class="hero-col">
            <img src="images/circle-star.png" alt="" class="circle-star">
            <img src="images/hlaf-circle-star.png" alt="" class="half-circle-star">
            <img src="images/hero-phone-car-en.png" alt="" class="hero-img">
        </div>

        <!-- Right: content -->
        <div class="content-col">
            <header class="site-header">
                <button id="lang-switch" class="lang-btn">Ar</button>
                <img src="images/logo.svg" alt="Hantoor" class="logo">
            </header>

            <div class="content-body">
                <div class="coming-soon-group">
                    <span class="pill-dot">✦</span>
                    <div class="coming-soon-pill">
                        <span id="badge-text">COMING SOON</span>
                    </div>
                    <span class="pill-dot">✦</span>
                </div>

                <h1 class="headline" id="main-heading">Your next rental experience</h1>
                <h2 class="headline-accent" id="accent-heading">is almost here</h2>
                <p class="subtitle" id="subtitle">Official rollout begins soon across Syria.</p>

            </div>
        </div>
    </div>

    <!-- Mobile: hero image at bottom -->
    <div class="mobile-hero" aria-hidden="true">
        <img src="images/hero-mobile-bottom-en.png" alt="">
    </div>

    <script src="script.js"></script>
</body>
</html>
